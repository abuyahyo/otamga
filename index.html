<!DOCTYPE html>
<html lang="uz-Cyrl">
<head>
<meta charset="UTF-8">

<meta name="theme-color" content="#0c1410" id="themeColorMeta">
<title>Отамга — Қуръон бетларини текшириш</title>

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Отамга">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<script>
(function () {
    try {
        var saved = localStorage.getItem('theme');
        var mode = saved === 'light' || saved === 'dark'
            ? saved
            : (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
        document.documentElement.classList.add(mode);
        var meta = document.getElementById('themeColorMeta');
        if (meta) meta.setAttribute('content', mode === 'light' ? '#fafbf9' : '#0c1410');
    } catch (e) {}
})();
</script>

<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Scheherazade+New:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css?v=22">
</head>
<body>

<div class="aurora" aria-hidden="true">
    <span class="aurora-blob aurora-blob-1"></span>
    <span class="aurora-blob aurora-blob-2"></span>
    <span class="aurora-blob aurora-blob-3"></span>
    <span class="aurora-grain"></span>
</div>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
        <symbol id="i-volume" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
            <path d="M11 5L6 9H2v6h4l5 4z" fill="currentColor"/>

        <symbol id="i-alert" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">

        <symbol id="i-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">

            <path d="M12 20v2"/>
            <path d="M4.93 4.93l1.41 1.41"/>
            <path d="M17.66 17.66l1.41 1.41"/>
            <path d="M2 12h2"/>
            <path d="M20 12h2"/>
            <path d="M4.93 19.07l1.41-1.41"/>
            <path d="M17.66 6.34l1.41-1.41"/>
        </symbol>
        <symbol id="i-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>

<div class="container">
    <header>
        <h1>Қори: Шайх Айман Сувайд</h1>

            <svg class="icon"><use href="#i-moon"/></svg>

    </header>

    <div class="form-section">
        <div class="form-group">
            <label for="pageInput">Бет рақамини киритинг (1 — 604):</label>

    <div id="loadingDiv" class="loading" style="display: none;">

    <div class="result-section" id="resultSection">

            <div class="sticky-progress-handle" id="stickyProgressHandle"></div>
        </div>
    </div>
    <button class="sticky-btn" id="stickyToggleBtn" type="button" aria-label="Қўйиш/Тўхтатиш">
        <svg class="icon"><use href="#i-pause"/></svg>
    </button>
    <button class="sticky-close" id="stickyCloseBtn" type="button" aria-label="Ёпиш">
        <svg class="icon"><use href="#i-close"/></svg>
    </button>
</div>

<script src="app.js?v=21" defer></script>

<script>
(function () {
    if (!('serviceWorker' in navigator)) return;

    var hadController = !!navigator.serviceWorker.controller;
    var pendingReload = false;
    var reloading = false;

    function safeReload() {
        if (reloading) return;
        reloading = true;
        location.reload();
    }

    function maybeReloadIfHidden() {
        if (!pendingReload) return;
        if (document.visibilityState === 'hidden') {
            safeReload();
        }
    }

    navigator.serviceWorker.addEventListener('controllerchange', function () {
        if (!hadController) return;
        pendingReload = true;
        maybeReloadIfHidden();
    });

    document.addEventListener('visibilitychange', maybeReloadIfHidden);

    window.addEventListener('load', function () {
        navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' })
            .then(function (reg) {
                reg.update().catch(function () {});
                setInterval(function () { reg.update().catch(function () {}); }, 60 * 60 * 1000);

                function activateWaiting() {
                    if (reg.waiting && navigator.serviceWorker.controller) {
                        reg.waiting.postMessage({ type: 'SKIP_WAITING' });
                    }
                }

                activateWaiting();
                reg.addEventListener('updatefound', function () {
                    var nw = reg.installing;
                    if (!nw) return;
                    nw.addEventListener('statechange', function () {
                        if (nw.state === 'installed' && navigator.serviceWorker.controller) {
                            nw.postMessage({ type: 'SKIP_WAITING' });
                        }
                    });
                });
            })
            .catch(function () {});
    });
})();
</script>

</body>
</html>
