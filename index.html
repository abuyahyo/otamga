<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Қуръон бетларини текшириш — Шайх Айман Сувайд</title>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Scheherazade+New:wght@400;700&display=swap" rel="stylesheet">
<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        font-family: 'Segoe UI', Tahoma, Arial, sans-serif;
        background-color: #f5f9f5;
        color: #2c3e2c;
        min-height: 100vh;
        padding: 20px;
        line-height: 1.6;
    }

    .container {
        max-width: 900px;
        margin: 0 auto;
        background: #ffffff;
        border-radius: 15px;
        box-shadow: 0 4px 20px rgba(0, 100, 0, 0.1);
        padding: 30px;
        border: 2px solid #e0f0e0;
    }

    header {
        text-align: center;
        padding-bottom: 25px;
        border-bottom: 3px solid #2d6a4f;
        margin-bottom: 30px;
    }

    header h1 {
        color: #1b4332;
        font-size: 32px;
        margin-bottom: 10px;
        font-weight: 700;
    }

    header p {
        color: #52796f;
        font-size: 20px;
    }

    .form-section {
        background: #f0f8f0;
        padding: 25px;
        border-radius: 12px;
        margin-bottom: 25px;
        border: 1px solid #c8e0c8;
    }

    .form-group {
        margin-bottom: 20px;
    }

    label {
        display: block;
        font-size: 22px;
        font-weight: 600;
        color: #1b4332;
        margin-bottom: 10px;
    }

    input {
        width: 100%;
        padding: 18px;
        font-size: 24px;
        border: 2px solid #95d5b2;
        border-radius: 10px;
        background: #ffffff;
        color: #2c3e2c;
        transition: border-color 0.3s;
        text-align: center;
        font-weight: 600;
    }

    input:focus {
        outline: none;
        border-color: #2d6a4f;
        box-shadow: 0 0 0 3px rgba(45, 106, 79, 0.2);
    }

    .btn {
        width: 100%;
        padding: 20px;
        font-size: 24px;
        font-weight: 700;
        border: none;
        border-radius: 12px;
        cursor: pointer;
        transition: all 0.3s;
        margin-top: 10px;
    }

    .btn-primary {
        background-color: #2d6a4f;
        color: white;
        box-shadow: 0 4px 10px rgba(45, 106, 79, 0.3);
    }

    .btn-primary:hover {
        background-color: #1b4332;
        transform: translateY(-2px);
    }

    .btn-primary:disabled {
        background-color: #95a5a6;
        cursor: not-allowed;
        transform: none;
    }

    .nav-buttons {
        display: flex;
        gap: 10px;
        margin-top: 15px;
    }

    .btn-nav {
        flex: 1;
        padding: 16px;
        font-size: 20px;
        font-weight: 600;
        background-color: #52796f;
        color: white;
        border: none;
        border-radius: 10px;
        cursor: pointer;
        transition: all 0.3s;
    }

    .btn-nav:hover {
        background-color: #2d6a4f;
    }

    .btn-nav:disabled {
        background-color: #b0c4b0;
        cursor: not-allowed;
    }

    .result-section {
        margin-top: 30px;
        display: none;
    }

    .result-section.active {
        display: block;
    }

    .page-info {
        text-align: center;
        font-size: 24px;
        color: #2d6a4f;
        margin-bottom: 20px;
        font-weight: 700;
        padding: 15px;
        background: #e8f5e8;
        border-radius: 10px;
        border: 2px solid #95d5b2;
    }

    .ayat-card {
        background: #fdfdf5;
        padding: 25px;
        border-radius: 12px;
        margin-bottom: 20px;
        border: 2px solid #d4e8d4;
        transition: all 0.3s;
    }

    .ayat-card.playing {
        border-color: #2d6a4f;
        box-shadow: 0 0 15px rgba(45, 106, 79, 0.3);
        background: #f0f8f0;
    }

    .ayat-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 15px;
        padding-bottom: 12px;
        border-bottom: 2px dashed #95d5b2;
        flex-wrap: wrap;
        gap: 10px;
    }

    .ayat-info {
        font-size: 20px;
        color: #2d6a4f;
        font-weight: 600;
    }

    .ayat-number {
        background: #2d6a4f;
        color: white;
        padding: 8px 18px;
        border-radius: 25px;
        font-size: 18px;
        font-weight: 700;
    }

    .arabic-text {
        font-family: 'Scheherazade New', 'Amiri', serif;
        font-size: 38px;
        line-height: 2;
        text-align: right;
        color: #1b4332;
        padding: 20px 15px;
        direction: rtl;
        background: #ffffff;
        border-radius: 10px;
        margin-bottom: 15px;
        border: 1px solid #e0f0e0;
    }

    .ayat-controls {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
    }

    .audio-btn {
        flex: 1;
        min-width: 120px;
        padding: 14px 20px;
        font-size: 18px;
        font-weight: 600;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        transition: all 0.3s;
        color: white;
    }

    .btn-play {
        background-color: #40916c;
    }

    .btn-play:hover {
        background-color: #2d6a4f;
    }

    .btn-pause {
        background-color: #d68c45;
    }

    .btn-pause:hover {
        background-color: #b87333;
    }

    .btn-replay {
        background-color: #1b4332;
    }

    .btn-replay:hover {
        background-color: #081c15;
    }

    .global-controls {
        background: #e8f5e8;
        padding: 20px;
        border-radius: 12px;
        margin-bottom: 20px;
        border: 2px solid #95d5b2;
        text-align: center;
    }

    .global-controls h3 {
        color: #1b4332;
        margin-bottom: 15px;
        font-size: 20px;
    }

    .global-buttons {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
    }

    .loading {
        text-align: center;
        font-size: 22px;
        color: #2d6a4f;
        padding: 30px;
    }

    .error {
        background-color: #ffe5e5;
        color: #c0392b;
        padding: 20px;
        border-radius: 10px;
        font-size: 20px;
        text-align: center;
        border: 2px solid #e74c3c;
        margin-top: 20px;
    }

    .info-text {
        font-size: 18px;
        color: #52796f;
        text-align: center;
        margin-top: 10px;
        font-style: italic;
    }

    .surah-divider {
        background: linear-gradient(135deg, #2d6a4f, #40916c);
        color: white;
        padding: 18px;
        border-radius: 10px;
        text-align: center;
        margin-bottom: 20px;
        font-size: 22px;
        font-weight: 700;
    }

    @media (max-width: 600px) {
        .container {
            padding: 20px;
        }

        header h1 {
            font-size: 24px;
        }

        .arabic-text {
            font-size: 32px;
            padding: 15px 10px;
        }

        .audio-btn {
            min-width: 100%;
        }
    }
</style>
</head>
<body>

<div class="container">
    <header>
        <h1>📖 Қуръон бетларини текшириш</h1>
        <p>Қори: Шайх Айман Сувайд (ҳафизаҳуллоҳ)</p>
    </header>

    <div class="form-section">
        <div class="form-group">
            <label for="pageInput">Бет рақамини киритинг (1 — 604):</label>
            <input type="number" id="pageInput" min="1" max="604" placeholder="Масалан: 1">
        </div>

        <button class="btn btn-primary" id="showBtn" onclick="betniKorsatish()">
            🔊 Бетни Кўрсатиш
        </button>

        <div class="nav-buttons">
            <button class="btn-nav" id="prevBtn" onclick="oldingiBet()" disabled>
                ⬅️ Олдинги бет
            </button>
            <button class="btn-nav" id="nextBtn" onclick="keyingiBet()" disabled>
                Кейинги бет ➡️
            </button>
        </div>
    </div>

    <div id="loadingDiv" class="loading" style="display: none;">
        ⏳ Юкланмоқда, илтимос кутинг...
    </div>

    <div id="errorDiv" class="error" style="display: none;"></div>

    <div class="result-section" id="resultSection">
        <div class="page-info" id="pageInfo"></div>
        
        <div class="global-controls">
            <h3>🎵 Бутун бетни эшитиш</h3>
            <div class="global-buttons">
                <button class="audio-btn btn-play" onclick="hammasiniQoyish()">
                    ▶️ Бошидан қўйиш
                </button>
                <button class="audio-btn btn-pause" onclick="hammasiniToxtatish()">
                    ⏸️ Тўхтатиш
                </button>
            </div>
            <p class="info-text">Барча оятлар кетма-кет автоматик янграйди</p>
        </div>

        <div id="ayatlarRoyxati"></div>
    </div>
</div>

<script>
    let joriyBet = 0;
    let oyatlar = [];
    let joriyOyatIndex = -1;
    let avtomatikQoyish = false;

    // Хатоликни кўрсатиш
    function xatolikniKorsatish(xabar) {
        const errorDiv = document.getElementById('errorDiv');
        errorDiv.textContent = '❌ ' + xabar;
        errorDiv.style.display = 'block';
        document.getElementById('loadingDiv').style.display = 'none';
        document.getElementById('resultSection').classList.remove('active');
    }

    function xatolikniYashirish() {
        document.getElementById('errorDiv').style.display = 'none';
    }

    // Асосий функция — бетни кўрсатиш
    async function betniKorsatish() {
        xatolikniYashirish();
        hammasiniToxtatish();
        
        const betRaqami = parseInt(document.getElementById('pageInput').value);
        const showBtn = document.getElementById('showBtn');

        if (!betRaqami || betRaqami < 1 || betRaqami > 604) {
            xatolikniKorsatish('Илтимос, 1 дан 604 гача бўлган бет рақамини киритинг!');
            return;
        }

        document.getElementById('loadingDiv').style.display = 'block';
        document.getElementById('resultSection').classList.remove('active');
        showBtn.disabled = true;
        showBtn.textContent = '⏳ Юкланмоқда...';

        try {
            // Арабча матн ва аудио учун иккита API чақируви
            const matnURL = `https://api.alquran.cloud/v1/page/${betRaqami}/quran-uthmani`;
            const audioURL = `https://api.alquran.cloud/v1/page/${betRaqami}/ar.aymanswaid`;

            const [matnResponse, audioResponse] = await Promise.all([
                fetch(matnURL),
                fetch(audioURL)
            ]);
            
            if (!matnResponse.ok || !audioResponse.ok) {
                throw new Error('API дан маълумот олиб бўлмади');
            }
            
            const matnData = await matnResponse.json();
            const audioData = await audioResponse.json();
            
            if (matnData.code !== 200 || audioData.code !== 200) {
                throw new Error('API дан хато қайтди');
            }

            // Маълумотларни сақлаш
            joriyBet = betRaqami;
            oyatlar = matnData.data.ayahs.map((oyat, index) => ({
                matn: oyat.text,
                oyatRaqami: oyat.numberInSurah,
                suraRaqami: oyat.surah.number,
                suraNomi: oyat.surah.name,
                suraNomiEn: oyat.surah.englishName,
                audioUrl: audioData.data.ayahs[index].audio
            }));

            betniRender();

            document.getElementById('loadingDiv').style.display = 'none';
            document.getElementById('resultSection').classList.add('active');

            // Навигация тугмалари
            document.getElementById('prevBtn').disabled = (betRaqami <= 1);
            document.getElementById('nextBtn').disabled = (betRaqami >= 604);

        } catch (error) {
            xatolikniKorsatish('Маълумотларни юклашда хатолик: ' + error.message + '. Интернет уланишини текширинг.');
        } finally {
            showBtn.disabled = false;
            showBtn.textContent = '🔊 Бетни Кўрсатиш';
        }
    }

    // Бет мазмунини HTML га чиқариш
    function betniRender() {
        document.getElementById('pageInfo').textContent = `📄 ${joriyBet}-бет`;
        
        const royxat = document.getElementById('ayatlarRoyxati');
        royxat.innerHTML = '';
        
        let oldingiSuraRaqami = -1;

        oyatlar.forEach((oyat, index) => {
            // Янги сура бошланса, ажратувчи қўшамиз
            if (oyat.suraRaqami !== oldingiSuraRaqami) {
                const divider = document.createElement('div');
                divider.className = 'surah-divider';
                divider.innerHTML = `📿 ${oyat.suraRaqami}-сура: <span style="font-family: 'Scheherazade New', serif;">${oyat.suraNomi}</span>`;
                royxat.appendChild(divider);
                oldingiSuraRaqami = oyat.suraRaqami;
            }

            const card = document.createElement('div');
            card.className = 'ayat-card';
            card.id = `ayat-${index}`;
            card.innerHTML = `
                <div class="ayat-header">
                    <span class="ayat-info">${oyat.suraRaqami}:${oyat.oyatRaqami}-оят</span>
                    <span class="ayat-number">${oyat.oyatRaqami}</span>
                </div>
                <div class="arabic-text">${oyat.matn}</div>
                <div class="ayat-controls">
                    <button class="audio-btn btn-play" onclick="oyatniQoyish(${index})">
                        ▶️ Эшитиш
                    </button>
                    <button class="audio-btn btn-replay" onclick="oyatniQaytaQoyish(${index})">
                        🔄 Қайта эшитиш
                    </button>
                </div>
            `;
            royxat.appendChild(card);
        });
    }

    // Аудио объект
    const audio = new Audio();
    
    audio.addEventListener('ended', function() {
        // Эски картадан "playing" классини олиб ташлаш
        const oldCard = document.getElementById(`ayat-${joriyOyatIndex}`);
        if (oldCard) oldCard.classList.remove('playing');

        // Агар автоматик режим бўлса, кейинги оятга ўтиш
        if (avtomatikQoyish && joriyOyatIndex < oyatlar.length - 1) {
            oyatniQoyish(joriyOyatIndex + 1, true);
        } else {
            avtomatikQoyish = false;
            joriyOyatIndex = -1;
        }
    });

    // Битта оятни қўйиш
    function oyatniQoyish(index, autoMode = false) {
        // Эски картадан "playing" ни олиб ташлаш
        const oldCard = document.getElementById(`ayat-${joriyOyatIndex}`);
        if (oldCard) oldCard.classList.remove('playing');

        joriyOyatIndex = index;
        avtomatikQoyish = autoMode;

        const yangiCard = document.getElementById(`ayat-${index}`);
        if (yangiCard) {
            yangiCard.classList.add('playing');
            yangiCard.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }

        audio.src = oyatlar[index].audioUrl;
        audio.play().catch(err => {
            console.log('Қўйишда муаммо:', err);
        });
    }

    function oyatniQaytaQoyish(index) {
        avtomatikQoyish = false;
        oyatniQoyish(index, false);
    }

    // Барча оятларни кетма-кет қўйиш
    function hammasiniQoyish() {
        if (oyatlar.length > 0) {
            oyatniQoyish(0, true);
        }
    }

    function hammasiniToxtatish() {
        avtomatikQoyish = false;
        audio.pause();
        const oldCard = document.getElementById(`ayat-${joriyOyatIndex}`);
        if (oldCard) oldCard.classList.remove('playing');
    }

    // Олдинги/Кейинги бет
    function oldingiBet() {
        if (joriyBet > 1) {
            document.getElementById('pageInput').value = joriyBet - 1;
            betniKorsatish();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }
    }

    function keyingiBet() {
        if (joriyBet < 604) {
            document.getElementById('pageInput').value = joriyBet + 1;
            betniKorsatish();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }
    }

    // Enter тугмаси билан қидириш
    document.getElementById('pageInput').addEventListener('keypress', function(e) {
        if (e.key === 'Enter') {
            betniKorsatish();
        }
    });
</script>

</body>
</html>
