<!DOCTYPE html>
<html lang="uz-Cyrl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#1b4332" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0a1c14" media="(prefers-color-scheme: dark)">
<title>Отамга — Қуръон бетларини текшириш</title>

<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Отамга">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Scheherazade+New:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css?v=5">
<script>
    (function() {
        const saved = localStorage.getItem('theme');
        const theme = saved || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.setAttribute('data-theme', theme);
    })();
</script>
</head>
<body>

<div class="container">
    <header>
        <button class="theme-toggle" id="themeToggle" type="button" aria-label="Режимни алмаштириш">🌙</button>
        <h1>📖 Қуръон бетларини текшириш</h1>
        <p>Қори: Шайх Айман Сувайд (ҳафизаҳуллоҳ)</p>
    </header>

    <div class="form-section">
        <div class="form-group">
            <label for="pageInput">Бет рақамини киритинг (1 — 604):</label>
            <input type="number" id="pageInput" min="1" max="604" step="1" placeholder="Масалан: 1" inputmode="numeric">
        </div>

        <button class="btn btn-primary" id="showBtn" type="button">
            🔊 Бетни Кўрсатиш
        </button>

        <div class="nav-buttons">
            <button class="btn-nav" id="prevBtn" type="button" disabled>
                ⬅️ Олдинги бет
            </button>
            <button class="btn-nav" id="nextBtn" type="button" disabled>
                Кейинги бет ➡️
            </button>
        </div>
    </div>

    <div id="loadingDiv" class="loading" style="display: none;">
        <div class="skeleton-list">
            <div class="skeleton-card"></div>
            <div class="skeleton-card"></div>
            <div class="skeleton-card"></div>
        </div>
    </div>

    <div id="errorDiv" class="error" style="display: none;"></div>

    <div class="result-section" id="resultSection">
        <div class="page-info" id="pageInfo"></div>

        <div class="global-controls">
            <h3>🎵 Бутун бетни эшитиш</h3>
            <div class="global-buttons">
                <button class="audio-btn btn-play" id="playAllBtn" type="button">
                    ▶️ Бошидан қўйиш
                </button>
                <button class="audio-btn btn-pause" id="pauseAllBtn" type="button">
                    ⏸️ Тўхтатиш
                </button>
            </div>
            <p class="info-text">Барча оятлар кетма-кет автоматик янграйди</p>
        </div>

        <div id="ayatlarRoyxati"></div>
    </div>
</div>

<div class="sticky-audio" id="stickyAudio" role="region" aria-label="Аудио плеер">
    <div class="sticky-info">
        <div class="sticky-title" id="stickyTitle">—</div>
        <div class="sticky-progress">
            <div class="sticky-progress-bar" id="stickyProgressBar"></div>
        </div>
    </div>
    <button class="sticky-btn" id="stickyToggleBtn" type="button" aria-label="Қўйиш/Тўхтатиш">⏸</button>
    <button class="sticky-close" id="stickyCloseBtn" type="button" aria-label="Ёпиш">✕</button>
</div>

<script src="app.js?v=5" defer></script>

</body>
</html>
